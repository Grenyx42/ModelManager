[project]
name = "modelmanager"
version = "0.1.0"
description = "Coordinator for LLM inference engines (Ollama, llama.cpp) across multiple GPU machines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Wade Hought" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
modelmanager = "modelmanager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelmanager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
